<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMR Dashboard — Compare Seasons</title>
<link rel="stylesheet" href="shared.css">
<style>
.season-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.season-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.season-chip input{cursor:pointer}
.nat-btn{background:var(--surface);border:var(--border-w) solid var(--border);color:var(--text);padding:6px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--border)}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-left">
    <a href="javascript:history.back()" class="hdr-btn" style="text-decoration:none">← Back</a>
    <span class="hdr-title">📊 Compare Seasons</span>
  </div>
  <div class="hdr-right">
    <span id="who" class="hdr-sub"></span>
  </div>
</div>

<div class="main">
  <div class="sec"><div class="sec-title">Seasons Included</div></div>
  <div id="season-pick" class="season-pick"></div>

  <div class="sec" style="margin-bottom:14px">
    <div style="display:flex;gap:6px">
      <button id="nat-btn-all" class="nat-btn" style="background:var(--accent);color:#fff" onclick="setNat('all')">Boiled+Raw</button>
      <button id="nat-btn-B" class="nat-btn" onclick="setNat('B')">Boiled</button>
      <button id="nat-btn-R" class="nat-btn" onclick="setNat('R')">Raw</button>
    </div>
  </div>

  <div class="kpi-grid" id="agg-kpis"></div>

  <div class="sec"><div class="sec-title">Districts — Aggregated Across Selected Seasons</div><div class="sec-cnt">Click a district to see its mills</div></div>
  <div class="tbl-wrap"><div class="tbl-scroll"><table id="dist-agg-tbl"></table></div></div>

  <div id="mill-detail-wrap" style="display:none;margin-top:20px">
    <div class="sec">
      <div class="sec-title" id="mill-detail-title">Mills</div>
      <button class="hdr-btn" onclick="closeMillDetail()">✕ Close</button>
    </div>
    <div class="tbl-wrap"><div class="tbl-scroll"><table id="mill-agg-tbl"></table></div></div>
  </div>
</div>

<script type="module" src="compare.js?v=20260802b"></script>
</body>
</html>

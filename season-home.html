<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMR Dashboard — Seasons</title>
<link rel="stylesheet" href="shared.css">
<style>
.season-card{background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-md);cursor:pointer;transition:transform .15s,box-shadow .15s}
.season-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--border)}
.season-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:20px 0}
.modal-bg{position:fixed;inset:0;background:rgba(26,26,46,.6);z-index:9000;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px;width:min(92vw,420px)}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-left">
    <span class="badge">LIVE</span>
    <span class="hdr-title">CMR Season Manager</span>
  </div>
  <div class="hdr-right">
    <span id="who" class="hdr-sub" style="margin-right:8px"></span>
    <button class="hdr-btn" onclick="location.href='aggregate.html'">📊 Compare Seasons</button>
    <button class="hdr-btn" style="background:#dc2626;color:#fff" onclick="logout()">⏻ Logout</button>
  </div>
</div>

<div class="main">
  <div class="sec">
    <div class="sec-title">Seasons</div>
    <button class="go-btn" style="padding:8px 20px;font-size:13px" onclick="openNewSeasonModal()">+ New Season</button>
  </div>
  <div id="season-grid" class="season-grid"></div>
  <div id="empty-msg" class="empty" style="display:none">No seasons yet. Click "+ New Season" to create the first one.</div>
</div>

<!-- New season modal -->
<div id="new-season-modal" class="modal-bg" onclick="if(event.target===this)closeNewSeasonModal()">
  <div class="modal-box">
    <div class="hdr-title" style="margin-bottom:14px">New Season</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <div class="kpi-lbl">Season Name</div>
        <input id="ns-name" class="srch" style="width:100%" placeholder="e.g. Kharif 2025-26">
      </div>
      <div style="display:flex;gap:10px">
        <div style="flex:1">
          <div class="kpi-lbl">Start Date</div>
          <input id="ns-start" type="date" class="srch" style="width:100%">
        </div>
        <div style="flex:1">
          <div class="kpi-lbl">End Date</div>
          <input id="ns-end" type="date" class="srch" style="width:100%">
        </div>
      </div>
      <div id="ns-err" style="font-size:12px;color:var(--red)"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="hdr-btn" onclick="closeNewSeasonModal()">Cancel</button>
        <button class="go-btn" style="padding:8px 20px;font-size:13px" onclick="createSeason()">Create & Upload Data</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="season-home.js"></script>
</body>
</html>
